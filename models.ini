version = 1

; Every section here becomes an entry in GET /v1/models -- the list the
; built-in WebUI, OpenCode and eidolon (providers/hoot.rn, from WSL) read.
;
; Paths are RELATIVE to the router's working directory, which hoot pins to
; the repo root (bin/hoot.ps1 serve/up, serve.ps1). Observed on a stock
; build: the child gets --model models/... verbatim and resolves it against
; that cwd (docs/design/linux.md findings 8-9). Forward slashes on purpose,
; so the same file reads on Windows and Linux.
;
; Upstream ggml-org/llama.cpp Vulkan build since 2026-09-26; the Bonsai
; models (and the PrismML fork they needed) were dropped then. The Bonsai
; rows below are kept as measurement history, not as served models, and
; every number here was taken on the Prism build -- re-bench on upstream.
;
; Settings below are measured on this box (Ryzen AI 7 PRO 350 / Radeon 860M),
; not guessed. llama-bench, tg32:
;   Qwen Q4_K_M   CPU 2.58  Vulkan 1.93   | pp128  CPU 15.6  Vulkan 33.3
;   Bonsai PTQ1_0 CPU 0.29  Vulkan 0.79   | pp128  CPU 16.0  Vulkan 27.0
;   Bonsai Q2_0   CPU 0.50  Vulkan 3.34   | pp128  CPU 16.2  Vulkan 35.5
;   Bonsai-8B Q1_0 CPU 10.56 Vulkan 10.27 | pp128  CPU 18.5  Vulkan 31.1  (Vulkan tg +-7, unstable)
; Thread sweep (Qwen, CPU): 4=2.65 6=2.56 8=2.71 12=2.23 16=2.20 -> bandwidth-bound.
; Qwen + MTP draft (spec decoding), same server, same prompt: 3.07 vs 1.83 tok/s.
;
; 2026-09-19, llama-bench -r 3 (the launcher's -r 1 cannot tell a result from
; the +-7 Vulkan swing noted below):
;   gpt-oss-20b MXFP4      CPU 12.21  Vulkan 8.45  | pp128  CPU 62.2  Vulkan 83.0
;   Qwen3-Coder-30B-A3B    CPU  7.33  Vulkan 9.37  | pp128  CPU 42.6  Vulkan 48.6
; Vulkan INVERTS between these two -- it costs gpt-oss 31% of decode and gains
; Qwen 28%. "Stay on CPU" is per-model here, not a property of the box.
;
; Speculative decoding LOSES on gpt-oss, measured not assumed (same server,
; same prompt, 200 tokens of code): no draft 12.35, EAGLE3-Q8_0 9.80 (-21%,
; 29-40% acceptance), ngram-simple 11.36 (-8%, 8% acceptance). Reason: MoE
; already cut the per-token read to ~2.08 GB, and the 0.92 GB draft head is
; 44% of what it is trying to save. Qwen's MTP head wins because it is 1.3 GB
; against a *dense* 17 GB read -- 7.6% -- at 84% acceptance. MoE and
; speculation solve the same bottleneck and do not stack.
;
; Batching barely helps decode (llama-batched-bench, npp128/ntg32):
;   B=1 10.61  B=2 15.35  B=4 11.72  B=8 12.37  tok/s aggregate
; Prompt processing does scale: 37.6 / 80.0 / 103.1 / 123.4. So long contexts
; are cheap and concurrent decode is not.
;
; Effective bandwidth, read x tok/s: Qwen27B 43.9 GB/s, gpt-oss 25.7,
; Qwen-A3B 18.8, bonsai-8b 11.6. An earlier revision of this block read that
; ordering as "smaller models stop buying speed." That is wrong, and the
; counter-example is in the same list: gpt-oss reads 2.08 GB per token and
; beats bonsai-8b, which reads 1.16 GB. Size alone cannot produce that.
;
; Holding the quant format fixed separates the variables. Both Qwen entries
; are Q4_K_M:
;     dense Q4_K_M, 17 GB streamed   43.9 GB/s
;     MoE   Q4_K_M, ~2.5 GB gathered 18.8 GB/s
; So the variable is the access pattern, not the read size -- dense weights
; stream; MoE experts are a scattered gather and give up more than half the
; bus. MXFP4 is a well-optimised kernel and holds 25.7.
;
; bonsai-8b's 11.6 is the odd one out and the cause is a HYPOTHESIS, not a
; measurement: Q1_0's dequant is expensive per byte, so it is compute-bound
; rather than bandwidth-bound. The thread sweep settles it -- a bandwidth-bound
; model is flat in threads (Qwen: 4=2.65 6=2.56 8=2.71 12=2.23 16=2.20), a
; compute-bound one scales. Untested on bonsai-8b as of this line.
;
; Consequence, because it is the one that matters: ~12 tok/s is the ceiling of
; what is ON THIS DISK, not a property of the box. If ~44 GB/s is a property
; of dense Q4_K_M rather than of large models, a 3-4B dense Q4_K_M predicts
; 18-23 tok/s. That projection is UNEARNED until gemma-3-12b is benched --
; dense, same quant, 2.3x smaller than the Qwen 27B, so ~6.0 tok/s confirms
; the constant and ~4 refutes it.

[*]
c = 16384
jinja = true
flash-attn = on
threads = 8

[Qwen3.8-27B-UD-Q4_K_M]
model = models/Qwen3.8-27B-UD-Q4_K_M/Qwen3.8-27B-UD-Q4_K_M.gguf
mmproj = models/Qwen3.8-27B-UD-Q4_K_M/mmproj-F16.gguf
; iGPU offload HURTS generation here (1.93 vs 2.58). Stay on CPU.
; Flip to 99 only if your workload is prompt-heavy -- Vulkan doubles pp128.
n-gpu-layers = 0
c = 16384
; Thinking is ON by default and burns the whole budget before answering --
; at ~2.7 tok/s that is minutes of silence per turn. Set to 'on' or 'auto'
; for hard reasoning tasks where you can afford the wait.
reasoning = off
; load-on-startup moved to [gpt-oss-20b] on 2026-09-19: this model is the
; slowest thing here (2.58 tok/s) and it was occupying one of only two
; --models-max slots from boot. Ask for it by name and it loads.
; MTP speculative decoding: the 1.3 GB draft head predicts multi-token runs and
; the big model only verifies. Measured 1.68x on code generation (84% acceptance).
model-draft = models/Qwen3.8-27B-UD-Q4_K_M/mtp-Qwen3.8-27B-Q4_0.gguf
spec-type = draft-mtp



[gpt-oss-20b]
; 21B total / 3.6B active MoE, native MXFP4 (12.1 GB on disk, 11.27 GiB
; resident). 12.21 tok/s on CPU -- 4.7x the Qwen 27B at 20B-class quality,
; and the best tokens-per-second-with-quality on this box.
model = models/gpt-oss-20b-MXFP4/gpt-oss-20b-MXFP4.gguf
; Vulkan costs 31% of decode here (8.45 vs 12.21) even though it gains 34% on
; prompt. Offload only if a workload is overwhelmingly prompt-heavy.
n-gpu-layers = 0
c = 16384
; No model-draft on purpose: the EAGLE3 head measured 21% SLOWER. See the
; header block. The draft GGUFs are kept beside the model for re-testing if a
; future llama.cpp changes the arithmetic.
; Preloaded instead of the Qwen 27B: 12.21 tok/s against 2.58, at 20B-class
; quality, so the first chat after a boot is the fast one.
load-on-startup = true

[gemma-3-12b]
; Dense 12B (6.79 GiB), vision via mmproj. ~6 tok/s -- half gpt-oss, so this
; is here for what it is good at, not for speed: a genuinely strong 12B with
; an image path, filling the gap between gpt-oss-20b and the 27Bs. Not benched under -r 3 yet; no line in the header block until it is.
model = models/gemma-3-12b-it-Q4_K_M/gemma-3-12b-it-Q4_K_M.gguf
mmproj = models/gemma-3-12b-it-Q4_K_M/mmproj-F16.gguf
n-gpu-layers = 0
c = 16384

[gemma-3-27b]
; Dense 27B Q4_K_M, vision via mmproj. Pulled, NOT load-confirmed and NOT
; benched (docs/Tasklist.md S1). CPU by the dense rule above (the Qwen 27B
; loses decode on Vulkan) -- a hypothesis for this model until measured.
model = models/gemma-3-27b-it-Q4_K_M/gemma-3-27b-it-Q4_K_M.gguf
mmproj = models/gemma-3-27b-it-Q4_K_M/mmproj-F16.gguf
n-gpu-layers = 0
c = 16384

[Qwen3-Coder-30B-A3B]
; 30B total / 3B active MoE, Q4_K_M (17.28 GiB). The one model here that
; Vulkan HELPS: tg32 9.37 vs 7.33 on CPU, pp128 48.6 vs 42.6 (header block;
; docs/Build-Log.md, taken under load, so floors). Not load-confirmed
; through the router yet.
model = models/Qwen3-Coder-30B-A3B-Instruct-Q4_K_M/Qwen3-Coder-30B-A3B-Instruct-Q4_K_M.gguf
n-gpu-layers = 99
c = 16384
