# The Minerva perch — one loopback process in front of many `eidolon web` doors.
#
# Standalone on purpose: its own `Cargo.toml` and its own `Cargo.lock`, and no
# membership in eidolon's workspace. The perch knows a door only as a binary, a
# stdout contract, a token file and HTTP, so it must not — and cannot — depend on
# any `eidolon-*` crate. It must not depend on an `aoide-*` crate either: those
# are GPL-3.0, and this crate is MIT like the rest of Minerva.
[package]
name = "perch"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "The Minerva perch: one loopback HTTP server in front of several `eidolon web` doors."
publish = false

[dependencies]
# `crypto::random_token` (256 bits from the OS CSPRNG) and `fs::write_atomic_0600`
# (temp file 0600 -> fsync -> rename). Both live in harnox's always-compiled core,
# so no feature is named here. Noah's crate, not eidolon's.
harnox = { path = "../harnox", default-features = false }

# The HTTP server, the door's exact stack and feature set. `server` + `http1` only:
# `client` (the proxy to a door) is H1c and not compiled here, no http2, and not a
# framework — the route table is a `match` on `(Method, path)`.
hyper = { version = "1", default-features = false, features = ["server", "http1"] }
# The pieces hyper 1.x moved out of itself: `TokioIo` to wrap the accepted socket,
# the http1 connection builder, and `server-graceful` so a quit drains an open
# response instead of cutting it mid-frame.
hyper-util = { version = "0.1", default-features = false, features = ["tokio", "server", "server-graceful", "http1"] }
# `Full` for every body this crate builds, and `Limited` for the 8 MiB cap.
http-body-util = "0.1"
# `Bytes` is what a body is by the time it reaches the socket.
bytes = "1"
# The runtime, the listener, the signals, and the cancellation token.
# `process` is deliberately absent: spawning doors is H1b.
tokio = { version = "1", features = ["rt-multi-thread", "net", "signal", "fs", "time", "io-util", "sync", "macros"] }
# `CancellationToken`, which is how a signal reaches the accept loop.
tokio-util = { version = "0.7", features = ["rt"] }
# The token comparison, constant time so a token cannot be searched for byte by byte.
subtle = "2"
# `getuid` for the runtime-dir ownership check. `prctl(PR_SET_PDEATHSIG)`, the other
# reason the door names libc, is H1b's and is not used here.
libc = "0.2"
# JSON for the `/hub` routes (H1b/H1c). Nothing in H1a serializes yet; the deps are
# named now so the first route does not have to touch this file.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The error convention both the door and harnox hold: `anyhow::Result`, `.context()`
# on IO, `bail!` for an early exit.
anyhow = "1"
# Diagnostics go to stderr at `RUST_LOG`'s level, and never to stdout: a supervisor
# reads stdout's two boot lines.
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive"] }

[dev-dependencies]
# Test directories for the runtime dir and the UI dir. Under `/tmp` (not the 9p
# mount Minerva lives on), because the 0600 checks need a filesystem that keeps
# permissions.
tempfile = "3"
