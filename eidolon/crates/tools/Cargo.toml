[package]
name = "eidolon-tools"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tokio-util.workspace = true
libc = "0.2"
tracing.workspace = true
regex.workspace = true
ignore.workspace = true
globset = "0.4"
# `image` reads an attachment's dimensions and brings an oversized one
# within what a model's wire will take; `harnox` is the message model the
# block it becomes belongs to; `base64` is the form both wires want.
image.workspace = true
harnox = { workspace = true, features = ["llm"] }
# `web` fetches one URL; the client is already in the workspace for the
# providers' sake, so this adds a use and not a dependency.
reqwest.workspace = true
base64.workspace = true
dirs.workspace = true

[dev-dependencies]
tempfile = "3"
