[package]
name = "eidolon-tui"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
eidolon-core.workspace = true
eidolon-swarm.workspace = true
eidolon-rune.workspace = true
eidolon-providers.workspace = true
# Dispatch mode resolves an utterance with the verba palette.
eidolon-verba.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tokio-util.workspace = true
async-trait.workspace = true
tracing.workspace = true
rune.workspace = true
rune-modules.workspace = true
ratatui = "0.30"
unicode-segmentation = "1"
# Search patterns are regexes, as Helix's are.
regex.workspace = true
base64.workspace = true
# `~`-relative paths in the session picker.
dirs.workspace = true
# Attached images: `eidolon-tools` reads them, `image` decodes them for
# the sixel encoder here.
eidolon-tools.workspace = true
image.workspace = true

[dev-dependencies]
tempfile = "3"
